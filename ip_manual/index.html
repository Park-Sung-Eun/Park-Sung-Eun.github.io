<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 1인기업 메뉴얼 — UI Kit</title>
<style id="ds-tokens">
/* ============================================================================
   IP MANUAL — DESIGN SYSTEM · FOUNDATIONS
   "Blueprint Manual" concept — dark technical schematic aesthetic.
   Dark canvas, electric-blue accents, monospace data + serif display.
   ----------------------------------------------------------------------------
   Fonts are loaded from Google Fonts (see fonts.css / the @import below).
   All four families are freely available on Google Fonts.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

:root {
  /* ── CANVAS & SURFACES ──────────────────────────────────────────────────
     Layered from deepest (page) up to raised cards. Near-black with a faint
     blue cast — never pure #000. Each step lifts by ~6–10 lightness units. */
  --bg:        #07090F;   /* page canvas — the blueprint paper */
  --surface:   #0D1220;   /* recessed panel / nav fill (w/ blur) */
  --surface-2: #111828;   /* secondary surface */
  --card:      #121A2E;   /* raised card fill */
  --card-hover:#16203A;   /* card on hover */

  /* ── BRAND BLUE ──────────────────────────────────────────────────────────
     The single accent. Electric blueprint blue. Mid is the workhorse;
     light is for text-on-dark accents; deep is the pressed/hover button. */
  --blue:       #2563EB;  /* primary — buttons, key accents */
  --blue-mid:   #3B82F6;  /* accent text, icons, eyebrows */
  --blue-lite:  #60A5FA;  /* bright accent text, active tabs */
  --blue-deep:  #1D4ED8;  /* button hover / pressed */
  --blue-glow:  rgba(37,99,235,.45); /* used for box-shadow glows */

  /* ── INK (foreground text) ─────────────────────────────────────────────── */
  --fg-1: #F1F5F9;   /* headings, high-emphasis (near-white) */
  --fg-2: #CBD5E1;   /* body copy — default text color */
  --fg-3: #94A3B8;   /* secondary body, captions */
  --fg-4: #64748B;   /* muted — labels, sources, de-emphasis */
  --fg-5: #2D3A52;   /* dim — disabled, faint blueprint text */

  /* ── BORDERS & LINES ───────────────────────────────────────────────────── */
  --border:    rgba(37,99,235,.20);  /* default hairline — blue-tinted */
  --border-2:  rgba(37,99,235,.38);  /* hover / active hairline */
  --border-3:  rgba(37,99,235,.08);  /* faint grid / blueprint lines */
  --rule:      linear-gradient(90deg,transparent,rgba(37,99,235,.20),transparent);

  /* ── SEMANTIC STATUS ──────────────────────────────────────────────────────
     Risk-meter palette: red = danger, yellow = warning, green = safe. */
  --red:    #EF4444;   --red-bg:    rgba(239,68,68,.07);   --red-bd:    rgba(239,68,68,.28);
  --yellow: #EAB308;   --yellow-bg: rgba(234,179,8,.07);   --yellow-bd: rgba(234,179,8,.28);
  --green:  #22C55E;   --green-bg:  rgba(34,197,94,.07);   --green-bd:  rgba(34,197,94,.28);

  /* ── TYPE FAMILIES ─────────────────────────────────────────────────────── */
  --serif: 'Playfair Display', Georgia, serif;      /* display headlines */
  --mono:  'DM Mono', 'SF Mono', monospace;          /* data, labels, HUD, code */
  --sans:  'DM Sans', 'Noto Sans KR', system-ui, sans-serif; /* body, UI, Korean */

  /* ── TYPE SCALE (desktop) ────────────────────────────────────────────────
     Display uses Playfair (heavy, tight). Section heads are light sans.
     Data/numerals use DM Mono medium. */
  --t-display:   clamp(54px, 5vw, 80px);  /* hero headline — serif 900 */
  --t-h1:        38px;   /* page title */
  --t-h2:        22px;   /* section heading — sans 400 */
  --t-h3:        18px;   /* card heading */
  --t-h4:        15px;   /* sub-heading / card title — sans 500 */
  --t-body:      15px;   /* body copy */
  --t-body-sm:   13px;   /* dense body, card body */
  --t-caption:   12px;   /* captions */
  --t-label:     11px;   /* labels */
  --t-data-xl:   44px;   /* big stat numeral — mono 500 */
  --t-data-lg:   28px;   /* medium numeral — mono 500 */
  --t-mono-sm:   10.5px; /* nav, eyebrow, tags — mono */
  --t-mono-xs:   9px;    /* HUD micro-labels — mono */

  /* ── SPACING (4px base) ──────────────────────────────────────────────────── */
  --sp-1: 4px;   --sp-2: 8px;   --sp-3: 12px;  --sp-4: 16px;
  --sp-5: 24px;  --sp-6: 32px;  --sp-7: 48px;  --sp-8: 72px;
  --sp-9: 100px;

  /* gutter / page padding */
  --page-pad: 80px;
  --content-max: 1440px;

  /* ── RADII ─────────────────────────────────────────────────────────────────
     Restrained. Cards 8px, controls 4px, tags 3px. Technical, not bubbly. */
  --r-xs: 3px;   /* tags, badges, checkboxes */
  --r-sm: 4px;   /* buttons, inputs, images */
  --r-md: 6px;   /* list rows */
  --r-lg: 8px;   /* cards, panels */

  /* ── ELEVATION ───────────────────────────────────────────────────────────
     Glow-forward, not drop-shadow heavy. Borders do the lifting; shadows are
     subtle and blue-tinted. The "top accent line" is the signature card lift. */
  --sh-card:   0 1px 0 rgba(255,255,255,.02) inset, 0 8px 28px rgba(0,0,0,.35);
  --sh-raised: 0 12px 40px rgba(0,0,0,.45), 0 0 0 1px var(--border-2);
  --sh-glow:   0 0 8px var(--blue-mid);             /* led dots, focus glow */
  --sh-btn:    0 6px 20px rgba(37,99,235,.35);      /* primary button */
  --glow-radial: radial-gradient(ellipse at 50% 0%, rgba(37,99,235,.07) 0%, transparent 65%);

  /* ── MOTION ──────────────────────────────────────────────────────────────
     Quick, eased, no bounce. Reveals are gentle rise+fade. */
  --ease:      cubic-bezier(.4,0,.2,1);
  --dur-fast:  .18s;
  --dur:       .2s;
  --dur-slow:  .65s;   /* scroll reveals */
  --dur-bar:   1.4s;   /* data bar fills */
}

/* ============================================================================
   SEMANTIC ELEMENT STYLES — apply these classes directly, or copy the rules.
   ========================================================================== */

.ds-display {
  font-family: var(--serif);
  font-size: var(--t-display);
  font-weight: 900;
  line-height: 1.06;
  letter-spacing: -.025em;
  color: var(--fg-1);
}
.ds-display .acc { color: var(--blue-mid); }

.ds-h1 { font-family: var(--serif); font-size: var(--t-h1); font-weight: 800; line-height: 1.12; letter-spacing: -.02em; color: var(--fg-1); }
.ds-h2 { font-family: var(--sans); font-size: var(--t-h2); font-weight: 400; line-height: 1.3; color: var(--fg-1); }
.ds-h3 { font-family: var(--sans); font-size: var(--t-h3); font-weight: 400; line-height: 1.35; color: var(--fg-1); }
.ds-h4 { font-family: var(--sans); font-size: var(--t-h4); font-weight: 500; line-height: 1.4; color: var(--fg-1); }

.ds-body { font-family: var(--sans); font-size: var(--t-body); font-weight: 300; line-height: 1.78; color: var(--fg-4); }
.ds-body strong { color: var(--fg-3); font-weight: 400; }
.ds-body-sm { font-family: var(--sans); font-size: var(--t-body-sm); font-weight: 300; line-height: 1.65; color: var(--fg-3); }

/* Eyebrow — the recurring mono kicker above section heads */
.ds-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--mono); font-size: var(--t-mono-sm);
  letter-spacing: .15em; text-transform: uppercase; color: var(--blue-mid);
}
.ds-eyebrow::before { content:''; width: 24px; height: 1px; background: var(--blue-mid); }

/* Mono data / code / HUD text */
.ds-mono { font-family: var(--mono); font-size: var(--t-mono-sm); letter-spacing: .07em; color: var(--fg-4); }
.ds-data { font-family: var(--mono); font-weight: 500; line-height: 1; }
.ds-data-xl { font-size: var(--t-data-xl); }
.ds-data-lg { font-size: var(--t-data-lg); }

/* HUD micro-label (corner schematic text) */
.ds-hud { font-family: var(--mono); font-size: var(--t-mono-xs); letter-spacing: .07em; line-height: 1.9; color: rgba(37,99,235,.32); }

</style>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    linear-gradient(rgba(37,99,235,.045) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(90deg, rgba(37,99,235,.045) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(rgba(37,99,235,.07) 1px, transparent 1px) 0 0 / 200px 200px,
    linear-gradient(90deg, rgba(37,99,235,.07) 1px, transparent 1px) 0 0 / 200px 200px,
    var(--bg);
  color:var(--fg-2);
  font-family:var(--sans);
  overflow-x:hidden;line-height:1.6;
}

/* ── BLUEPRINT BG ── */
.bp{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bp svg{width:100%;height:100%}

/* ── NAVBAR ── */
.navbar{
  position:fixed;top:0;left:0;right:0;z-index:200;height:52px;
  background:rgba(7,9,15,.92);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 60px;
}
.nav-logo{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;color:var(--blue-lite);display:flex;align-items:center;gap:8px;white-space:nowrap;}
.ndot{width:5px;height:5px;border-radius:50%;background:var(--blue-mid);box-shadow:0 0 8px var(--blue-mid);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.nsep{width:1px;height:20px;background:var(--border);margin:0 24px}
.nav-tabs{display:flex;gap:2px;flex:1}
.nav-tab{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.07em;color:var(--fg-4);padding:5px 13px;border-radius:var(--r-xs);cursor:pointer;border:1px solid transparent;background:none;transition:all .18s;white-space:nowrap;text-decoration:none;display:flex;align-items:center;gap:5px;}
.nav-tab .ti{font-size:9px;color:var(--fg-5)}
.nav-tab:hover{color:var(--fg-1);background:rgba(255,255,255,.03);border-color:var(--border)}
.nav-tab.active{color:var(--blue-lite);background:rgba(37,99,235,.09);border-color:var(--border-2)}
.nav-tab.active .ti{color:var(--blue-mid)}
.nav-right{font-family:var(--mono);font-size:10px;color:var(--fg-4);letter-spacing:.1em;display:flex;align-items:center;gap:8px;margin-left:auto;}

.page{position:relative;z-index:1;padding-top:52px}

/* ── HERO ── */
.hero{min-height:100vh;display:grid;grid-template-columns:1fr 460px;align-items:center;max-width:var(--content-max);margin:0 auto;padding:0 var(--page-pad);position:relative;}
.hud{position:absolute;font-family:var(--mono);font-size:9px;color:rgba(37,99,235,.32);letter-spacing:.07em;line-height:1.9;}
.hud-tl{top:28px;left:80px}.hud-tr{top:28px;right:80px;text-align:right}
.hud-bl{bottom:32px;left:80px}.hud-br{bottom:32px;right:80px;text-align:right}
.hud::before{content:'';display:block;width:14px;height:14px;border-top:1px solid rgba(37,99,235,.26);border-left:1px solid rgba(37,99,235,.26);margin-bottom:5px;}
.hud-tr::before,.hud-br::before{border-left:none;border-right:1px solid rgba(37,99,235,.26);margin-left:auto;}
.hud-bl::before,.hud-br::before{border-top:none;border-bottom:1px solid rgba(37,99,235,.26);}
.hero-left{display:flex;flex-direction:column;justify-content:center;padding:100px 60px 100px 0;}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue-mid);margin-bottom:28px;}
.eyebrow::before{content:'';width:28px;height:1px;background:var(--blue-mid)}
.eyebrow::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
h1.headline{font-family:var(--serif);font-size:clamp(54px,5vw,80px);font-weight:900;line-height:1.06;letter-spacing:-.025em;color:var(--fg-1);margin-bottom:24px;}
h1.headline .acc{color:var(--blue-mid)}
.hero-desc{font-size:15px;font-weight:300;color:var(--fg-4);line-height:1.78;max-width:480px;}
.hero-desc strong{color:#94A3B8;font-weight:400}
.hero-right{display:flex;align-items:center;justify-content:center;border-left:1px solid var(--border);padding:48px 40px;min-height:100vh;}
.hero-img-wrap{width:100%;max-width:380px;position:relative;}
.hero-img-wrap img{width:100%;height:auto;display:block;border-radius:var(--r-sm);mix-blend-mode:lighten;}
.hero-img-wrap::before,.hero-img-wrap::after{content:'';position:absolute;width:20px;height:20px;}
.hero-img-wrap::before{top:-6px;left:-6px;border-top:1px solid rgba(37,99,235,.5);border-left:1px solid rgba(37,99,235,.5);}
.hero-img-wrap::after{bottom:-6px;right:-6px;border-bottom:1px solid rgba(37,99,235,.5);border-right:1px solid rgba(37,99,235,.5);}

/* ── CONTENT WRAP ── */
.cw{max-width:var(--content-max);margin:0 auto;padding:0 var(--page-pad);position:relative;z-index:1;}
.sec-rule{height:1px;background:var(--rule);}
.sec-block{padding:72px 0}
.sec-ey{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--blue-mid);margin-bottom:10px;}
.sec-ey::before{content:'';width:20px;height:1px;background:var(--border-2)}
.sec-h{font-size:22px;font-weight:400;color:var(--fg-1);margin-bottom:6px;line-height:1.3}
.sec-s{font-size:13px;color:var(--fg-4);margin-bottom:32px;max-width:560px;line-height:1.7}

/* ── STAT CARDS ── */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px 24px;position:relative;overflow:hidden;transition:border-color .2s;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--blue);opacity:0;transition:opacity .2s;}
.stat-card:hover{border-color:var(--border-2)}
.stat-card:hover::before{opacity:1}
.stat-card::after{content:'';position:absolute;inset:0;background:var(--glow-radial);pointer-events:none;}
.snum{font-family:var(--mono);font-size:44px;font-weight:500;line-height:1;margin-bottom:10px;display:block;}
.slbl{font-size:12px;color:var(--fg-4);line-height:1.5;margin-bottom:6px}
.ssrc{font-family:var(--mono);font-size:9px;color:var(--fg-5);letter-spacing:.04em}

/* ── MIRROR BAR ── */
.mirror-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px 32px;position:relative;}
.hix-tag{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--yellow);background:var(--yellow-bg);border:1px solid var(--yellow-bd);padding:3px 9px;border-radius:var(--r-xs);}
.mlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-4);margin-bottom:10px;}
.mbars{display:flex;height:64px;margin-bottom:10px;}
.ms{flex:1;display:flex;align-items:center;position:relative;overflow:hidden;border-radius:var(--r-sm);}
.ms.l{justify-content:flex-end;padding-right:16px;background:rgba(100,116,139,.08);border-radius:4px 0 0 4px;}
.ms.r{justify-content:flex-start;padding-left:16px;background:rgba(37,99,235,.06);border-radius:0 4px 4px 0;}
.mf{position:absolute;top:0;bottom:0;width:0;transition:width 1.4s var(--ease);}
.ms.l .mf{right:0;background:rgba(100,116,139,.22);border-radius:4px 0 0 4px;}
.ms.r .mf{left:0;background:rgba(37,99,235,.18);border-radius:0 4px 4px 0;transition-delay:.15s;}
.mdiv{width:2px;background:var(--border-2);flex-shrink:0;z-index:2;}
.mv{font-family:var(--mono);font-size:28px;font-weight:500;position:relative;z-index:1;}
.mgap{text-align:center;font-family:var(--mono);font-size:10px;color:var(--blue-lite);letter-spacing:.06em;padding-top:8px;border-top:1px solid var(--border);}

/* ── CASE CARDS ── */
.case-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.case-card{background:var(--card);border:1px solid var(--red-bd);border-radius:var(--r-lg);overflow:hidden;transition:border-color .2s;display:flex;flex-direction:column;}
.case-card:hover{border-color:rgba(239,68,68,.4)}
.case-card::before{content:'';display:block;height:1px;background:linear-gradient(90deg,var(--red),transparent);opacity:.6;}
.case-img{width:100%;height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;border-bottom:1px solid rgba(239,68,68,.15);position:relative;}
.case-img img{width:100%;height:100%;object-fit:contain;padding:16px;}
.case-img::after{content:'';position:absolute;inset:0;background:rgba(7,9,15,.12);pointer-events:none;}
.case-body-wrap{padding:22px 24px;flex:1;display:flex;flex-direction:column;}
.case-badge{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--red);background:var(--red-bg);border:1px solid var(--red-bd);padding:3px 8px;border-radius:var(--r-xs);display:inline-block;margin-bottom:12px;align-self:flex-start;}
.case-title{font-size:15px;font-weight:500;color:var(--fg-1);margin-bottom:8px;}
.case-body{font-size:13px;color:#94A3B8;line-height:1.65;margin-bottom:12px;flex:1;}
.case-foot{font-family:var(--mono);font-size:9px;color:var(--fg-5);letter-spacing:.04em;}

/* ── DIAGNOSIS ── */
.diag-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:32px 36px;}
.diag-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;}
.diag-h{font-size:18px;font-weight:400;color:var(--fg-1);margin-bottom:4px;}
.diag-s{font-size:12px;color:var(--fg-4);}
.dcnt{font-family:var(--mono);font-size:26px;font-weight:500;color:var(--blue-lite);text-align:right;line-height:1;}
.dcnt small{font-size:11px;color:var(--fg-5);display:block;margin-top:3px;letter-spacing:.04em;}
.dlist{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;}
.di{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 18px;cursor:pointer;transition:all .18s;user-select:none;}
.di:hover{border-color:var(--border-2);background:rgba(37,99,235,.04)}
.di.on{border-color:var(--border-2);background:rgba(37,99,235,.08)}
.dcb{width:18px;height:18px;border:1px solid var(--fg-5);border-radius:var(--r-xs);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;transition:all .15s;}
.di.on .dcb{background:var(--blue);border-color:var(--blue);color:#fff;}
.dtxt{font-size:13px;color:#94A3B8;line-height:1.4;transition:color .15s;}
.di.on .dtxt{color:var(--fg-1);}
.dres{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:var(--r-md);border:1px solid var(--border);background:rgba(255,255,255,.02);transition:all .3s;}
.rbadge{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;padding:6px 14px;border-radius:var(--r-xs);flex-shrink:0;white-space:nowrap;border:1px solid var(--fg-5);color:var(--fg-5);transition:all .3s;}
.rbadge.green{background:var(--green-bg);border-color:var(--green-bd);color:var(--green);}
.rbadge.yellow{background:var(--yellow-bg);border-color:var(--yellow-bd);color:var(--yellow);}
.rbadge.red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red);}
.rmsg{font-size:13px;color:var(--fg-4);line-height:1.5;}
.rmsg strong{font-weight:500;color:var(--fg-1);}

/* ── NEXT CTA ── */
.next-wrap{padding:48px 0 80px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);}
.nlbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--fg-4);margin-bottom:8px;text-transform:uppercase;}
.nh{font-size:20px;font-weight:400;color:var(--fg-1);margin-bottom:4px;}
.ns{font-size:13px;color:var(--fg-4);}
.btn-next{display:inline-flex;align-items:center;gap:10px;background:var(--blue);color:#fff;font-family:var(--sans);font-size:13px;font-weight:500;padding:13px 26px;border-radius:var(--r-sm);border:none;cursor:pointer;text-decoration:none;letter-spacing:.02em;transition:all .2s;white-space:nowrap;box-shadow:var(--sh-btn);}
.btn-next:hover{background:var(--blue-deep);transform:translateY(-1px)}
.btn-next svg{transition:transform .2s}
.btn-next:hover svg{transform:translateX(3px)}

/* ── PLACEHOLDER ── */
.ph{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-top:1px solid var(--border);opacity:.22;padding:60px;}
.ph-s{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--blue-mid);margin-bottom:16px;text-transform:uppercase;}
.ph-h{font-size:30px;font-weight:300;color:var(--fg-1);line-height:1.3;}
.ph-n{font-family:var(--mono);font-size:10px;color:var(--fg-5);margin-top:14px;letter-spacing:.06em;}

footer{border-top:1px solid var(--border);padding:22px var(--page-pad);font-family:var(--mono);font-size:10px;color:var(--fg-5);letter-spacing:.07em;display:flex;justify-content:space-between;position:relative;z-index:1;}

/* ════ STEP SECTIONS (01–05) ════ */
.step-sec{border-top:1px solid var(--border);scroll-margin-top:52px;position:relative;z-index:1;}
.step-sec .cw{padding-top:0;padding-bottom:0;}
.step-head{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:start;padding:74px 0 44px;}
.step-index{font-family:var(--mono);font-size:104px;font-weight:500;line-height:.78;color:transparent;-webkit-text-stroke:1px var(--border-2);user-select:none;}
.step-kicker{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue-mid);margin-bottom:16px;}
.step-kicker::before{content:'';width:26px;height:1px;background:var(--blue-mid);}
.step-title{font-family:var(--serif);font-size:40px;font-weight:800;letter-spacing:-.02em;color:var(--fg-1);line-height:1.1;margin-bottom:16px;}
.step-title .acc{color:var(--blue-mid);}
.step-desc{font-size:15px;font-weight:300;color:var(--fg-4);line-height:1.75;max-width:640px;}
.step-desc strong{color:var(--fg-3);font-weight:400;}

.module{padding:0 0 44px;}
.mod-label{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue-lite);margin-bottom:20px;}
.mod-label::before{content:'';width:16px;height:1px;background:var(--border-2);}
.mod-label .ix{color:var(--fg-5);}

/* IP rights / card grids */
.card-grid{display:grid;gap:10px;}
.g5{grid-template-columns:repeat(5,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.feat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px 20px;position:relative;overflow:hidden;transition:border-color .2s;}
.feat-card:hover{border-color:var(--border-2);}
.feat-card::after{content:'';position:absolute;inset:0;background:var(--glow-radial);pointer-events:none;opacity:0;transition:opacity .25s;}
.feat-card:hover::after{opacity:1;}
.feat-tag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--blue-lite);background:rgba(37,99,235,.08);border:1px solid var(--border-2);padding:3px 8px;border-radius:var(--r-xs);}
.feat-name{font-size:15px;font-weight:500;color:var(--fg-1);margin:14px 0 8px;}
.feat-desc{font-size:12px;color:var(--fg-4);line-height:1.6;}
.feat-meta{font-family:var(--mono);font-size:9.5px;color:#8595af;letter-spacing:.04em;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-3);}
.feat-meta b{color:var(--blue-lite);font-weight:500;}

/* matrix / comparison tables */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.tbl th,.tbl td{border:1px solid var(--border);padding:13px 16px;}
.tbl thead th{font-family:var(--mono);font-size:10px;letter-spacing:.06em;font-weight:500;color:var(--blue-lite);background:rgba(37,99,235,.05);text-align:center;}
.tbl tbody th{text-align:left;color:var(--fg-2);font-weight:500;font-size:13px;background:rgba(255,255,255,.015);white-space:nowrap;}
.tbl td{text-align:center;color:var(--fg-3);}
.tbl td.l{text-align:left;color:var(--fg-4);font-size:12px;line-height:1.5;}
.tbl tbody tr:hover{background:rgba(37,99,235,.03);}
.dot-y{width:8px;height:8px;border-radius:50%;background:var(--blue-mid);box-shadow:0 0 8px var(--blue-mid);display:inline-block;}
.dot-n{width:8px;height:8px;border-radius:50%;border:1px solid var(--fg-5);display:inline-block;}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;padding:3px 9px;border-radius:var(--r-xs);display:inline-block;white-space:nowrap;}
.pill.ok{color:var(--green);background:var(--green-bg);border:1px solid var(--green-bd);}
.pill.warn{color:var(--yellow);background:var(--yellow-bg);border:1px solid var(--yellow-bd);}
.pill.no{color:var(--red);background:var(--red-bg);border:1px solid var(--red-bd);}

/* flow timeline */
.flow{margin-top:4px;}
.flow-item{display:grid;grid-template-columns:46px 1fr;gap:22px;position:relative;}
.flow-item:not(:last-child)::before{content:'';position:absolute;left:22px;top:46px;bottom:-6px;width:1px;background:var(--border);}
.flow-num{width:46px;height:46px;border-radius:50%;border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;font-weight:500;color:var(--blue-lite);background:var(--card);z-index:1;}
.flow-body{padding-bottom:30px;}
.flow-t{font-size:15px;font-weight:500;color:var(--fg-1);margin-bottom:7px;}
.flow-d{font-size:13px;color:var(--fg-4);line-height:1.65;max-width:600px;}
.flow-d code{font-family:var(--mono);font-size:11.5px;color:var(--blue-lite);background:rgba(37,99,235,.07);padding:1px 6px;border-radius:3px;}

/* checklist (static) */
.check-row{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--r-md);padding:15px 18px;margin-bottom:6px;transition:border-color .18s;}
.check-row:hover{border-color:var(--border-2);}
.check-box{width:18px;height:18px;border-radius:var(--r-xs);border:1px solid var(--blue);background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;flex-shrink:0;}
.check-text{font-size:13px;color:var(--fg-2);white-space:nowrap;}
.check-tag{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--fg-4);letter-spacing:.05em;white-space:nowrap;}

/* callout */
.callout{display:flex;gap:18px;align-items:center;background:rgba(37,99,235,.06);border:1px solid var(--border-2);border-radius:var(--r-lg);padding:20px 24px;margin-top:12px;}
.callout-tag{font-family:var(--mono);font-size:10px;color:var(--blue-lite);letter-spacing:.1em;flex-shrink:0;border-right:1px solid var(--border);padding-right:18px;white-space:nowrap;}
.callout-text{font-size:13px;color:var(--fg-2);line-height:1.65;}
.callout-text strong{color:var(--fg-1);font-weight:500;}

/* step nav (prev / next) */
.step-nav{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--border);margin-top:8px;padding:34px 0 78px;}
.btn-prev{display:inline-flex;align-items:center;gap:9px;background:transparent;color:var(--fg-3);font-family:var(--sans);font-size:13px;font-weight:400;padding:12px 20px;border-radius:var(--r-sm);border:1px solid var(--border);text-decoration:none;transition:all .2s;}
.btn-prev:hover{border-color:var(--border-2);color:var(--fg-1);background:rgba(37,99,235,.05);}
.step-nav .meta{font-family:var(--mono);font-size:10px;color:var(--fg-5);letter-spacing:.1em;}

/* finish card */
.finish{position:relative;text-align:center;border:1px solid var(--border-2);border-radius:var(--r-lg);background:var(--card);padding:56px 40px;margin:4px 0 78px;overflow:hidden;}
.finish::after{content:'';position:absolute;inset:0;background:var(--glow-radial);pointer-events:none;}
.finish-tag{position:relative;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--blue-lite);text-transform:uppercase;margin-bottom:18px;}
.finish-h{position:relative;font-family:var(--serif);font-size:34px;font-weight:800;color:var(--fg-1);line-height:1.2;margin-bottom:14px;}
.finish-p{position:relative;font-size:14px;font-weight:300;color:var(--fg-4);line-height:1.7;max-width:480px;margin:0 auto 26px;}
.finish a{position:relative;}

@media (max-width:900px){
  .g5,.g3{grid-template-columns:1fr 1fr;}
  .step-head{grid-template-columns:1fr;gap:14px;}
  .step-index{font-size:72px;}
}

/* ════ INFOGRAPHICS (STEP 01–05) ════ */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px 26px;position:relative;}
.panel::before{content:'';position:absolute;top:0;left:24px;right:24px;height:1px;background:linear-gradient(90deg,transparent,var(--blue-mid),transparent);opacity:.5;}
.panel-h{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;color:var(--fg-1);margin-bottom:18px;white-space:nowrap;}
.panel-h .pmark{color:var(--blue-lite);font-size:13px;}
.panel-note{font-family:var(--mono);font-size:9.5px;color:#8595af;letter-spacing:.03em;margin-top:14px;}

/* numbered-circle matrix */
.nmx{width:100%;border-collapse:collapse;}
.nmx th,.nmx td{padding:11px 8px;text-align:center;border-bottom:1px solid var(--border-3);}
.nmx thead th{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--blue-lite);font-weight:500;}
.nmx tbody th{text-align:left;font-size:13px;font-weight:500;color:var(--fg-2);white-space:nowrap;}
.nmx tbody tr:last-child td,.nmx tbody tr:last-child th{border-bottom:none;}
.ncirc{width:36px;height:36px;border-radius:50%;border:1px solid var(--border-2);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;color:var(--fg-3);}
.ncirc.max{border-color:var(--blue);color:#fff;background:rgba(37,99,235,.16);box-shadow:0 0 14px var(--blue-glow);}

/* regulation spectrum table */
.regtbl{width:100%;border-collapse:collapse;}
.regtbl th,.regtbl td{padding:12px 10px;border-bottom:1px solid var(--border-3);font-size:12.5px;text-align:center;}
.regtbl thead th{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--blue-lite);font-weight:500;}
.regtbl tbody th{text-align:left;color:var(--fg-2);font-weight:500;white-space:nowrap;}
.regtbl tbody tr:last-child td,.regtbl tbody tr:last-child th{border-bottom:none;}
.sym{font-family:var(--mono);font-weight:500;}
.sym.x{color:var(--red);} .sym.t{color:var(--yellow);} .sym.o{color:var(--green);}
.rdot{display:inline-flex;align-items:center;gap:7px;justify-content:center;font-size:11.5px;white-space:nowrap;}
.rdot i{width:9px;height:9px;border-radius:50%;display:inline-block;}

/* speed-compare bars */
.bar-row{margin-bottom:20px;}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--fg-3);margin-bottom:8px;gap:12px;white-space:nowrap;}
.bar-top b{font-family:var(--mono);font-size:11px;}
.bar-track{height:36px;border-radius:var(--r-sm);background:rgba(255,255,255,.03);border:1px solid var(--border);overflow:hidden;}
.bar-fill{height:100%;display:flex;align-items:center;padding:0 14px;font-family:var(--mono);font-size:12px;font-weight:500;color:#fff;width:0;transition:width 1.3s var(--ease);white-space:nowrap;}
.bar-fill.red{background:linear-gradient(90deg,rgba(239,68,68,.55),rgba(239,68,68,.28));}
.bar-fill.grn{background:linear-gradient(90deg,rgba(34,197,94,.55),rgba(34,197,94,.25));}

/* waffle / pictograph */
.waffle{display:grid;grid-template-columns:repeat(10,14px);gap:4px;}
.wcell{width:14px;height:14px;border-radius:2px;background:rgba(255,255,255,.05);}
.wcell.on{background:var(--blue-mid);box-shadow:0 0 6px var(--blue-glow);}
.waffle-big{font-family:var(--mono);font-size:40px;font-weight:500;color:var(--yellow);line-height:1;margin:16px 0 8px;}

/* horizontal workflow nodes */
.wf{display:flex;align-items:stretch;}
.wf-node{flex:1;background:rgba(37,99,235,.05);border:1px solid var(--border-2);border-radius:var(--r-md);padding:16px 12px;text-align:center;}
.wf-node .wn-tag{font-family:var(--mono);font-size:9px;color:var(--blue-lite);letter-spacing:.08em;margin-bottom:8px;}
.wf-node .wn-t{font-size:13px;font-weight:500;color:var(--fg-1);margin-bottom:5px;}
.wf-node .wn-d{font-family:var(--mono);font-size:9px;color:var(--fg-4);}
.wf-conn{display:flex;align-items:center;color:var(--blue-mid);padding:0 8px;flex-shrink:0;}

/* DO / DON'T */
.dd{border-radius:var(--r-lg);padding:20px 22px;border:1px solid;}
.dd.do{border-color:rgba(34,197,94,.28);background:rgba(34,197,94,.04);border-left:3px solid var(--green);}
.dd.dont{border-color:rgba(239,68,68,.28);background:rgba(239,68,68,.04);border-left:3px solid var(--red);}
.dd.warn{border-color:rgba(234,179,8,.3);background:rgba(234,179,8,.04);border-left:3px solid var(--yellow);}
.dd.warn .dd-h{color:var(--yellow);}
.dd-li .tx em{color:var(--fg-3);font-style:normal;font-size:11px;display:block;margin-top:2px;}
.dd-h{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;letter-spacing:.02em;margin-bottom:14px;white-space:nowrap;}
.dd.do .dd-h{color:var(--green);} .dd.dont .dd-h{color:var(--red);}
.dd-li{display:flex;gap:11px;margin-bottom:12px;}
.dd-li:last-child{margin-bottom:0;}
.dd-li .mk{width:7px;height:7px;border-radius:2px;margin-top:6px;flex-shrink:0;box-shadow:0 0 6px var(--blue-glow);}
.dd.do .dd-li .mk{background:var(--blue-mid);} .dd.dont .dd-li .mk{background:var(--blue-mid);}
.dd-li .tx{font-size:12.5px;color:var(--fg-2);line-height:1.5;}
.dd-li .tx b{display:block;color:var(--fg-1);font-weight:500;margin-bottom:2px;}

/* decision tree */
.dtree-q{border:1px solid var(--border-2);border-radius:var(--r-md);padding:15px 18px;text-align:center;font-size:13px;color:var(--fg-1);background:rgba(37,99,235,.05);margin-bottom:18px;font-weight:500;}
.dtree-branches{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.dtree-b{border-radius:var(--r-md);padding:16px 18px;border:1px solid;text-align:center;}
.dtree-b.danger{border-color:var(--red-bd);background:var(--red-bg);}
.dtree-b.safe{border-color:var(--yellow-bd);background:var(--yellow-bg);}
.dtree-b .bh{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.04em;margin-bottom:8px;}
.dtree-b.danger .bh{color:var(--red);} .dtree-b.safe .bh{color:var(--yellow);}
.dtree-b .bd{font-size:11.5px;color:var(--fg-4);line-height:1.5;}

/* spectrum slider */
.spectrum{height:14px;border-radius:7px;background:linear-gradient(90deg,#22d3ee,#3b82f6,#8b5cf6,#ef4444);position:relative;margin:26px 0 12px;}
.spectrum-mark{position:absolute;top:-7px;width:3px;height:28px;background:#fff;left:62%;box-shadow:0 0 10px #fff;border-radius:2px;}
.spectrum-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--fg-4);letter-spacing:.03em;}
.spectrum-mid{text-align:center;font-family:var(--mono);font-size:10px;color:var(--blue-lite);margin-top:4px;}

/* circular ring */
.ring-row{display:flex;align-items:center;gap:26px;}
.ring-wrap{position:relative;width:150px;height:150px;flex-shrink:0;}
.ring-pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-num{font-family:var(--mono);font-size:30px;font-weight:500;line-height:1;}
.ring-lbl{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--fg-4);margin-top:5px;}

/* interactive checkbox (user-toggled) */
.ic-row{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 18px;margin-bottom:6px;cursor:pointer;user-select:none;transition:all .18s;}
.ic-row:hover{border-color:var(--border-2);background:rgba(37,99,235,.04);}
.ic-row.on{border-color:var(--border-2);background:rgba(37,99,235,.08);}
.ic-box{width:19px;height:19px;border-radius:var(--r-xs);border:1px solid var(--fg-5);background:transparent;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;flex-shrink:0;transition:all .15s;}
.ic-row.on .ic-box{background:var(--blue);border-color:var(--blue);color:#fff;}
.ic-text{font-size:13px;color:var(--fg-3);transition:color .15s;white-space:nowrap;}
.ic-row.on .ic-text{color:var(--fg-1);}
.ic-tag{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--fg-4);letter-spacing:.05em;white-space:nowrap;}
.ic-result{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:var(--r-md);border:1px solid var(--border);background:rgba(255,255,255,.02);margin-top:12px;transition:all .3s;}
.ic-badge{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;padding:6px 14px;border-radius:var(--r-xs);flex-shrink:0;white-space:nowrap;border:1px solid var(--fg-5);color:var(--fg-5);transition:all .3s;}
.ic-badge.green{background:var(--green-bg);border-color:var(--green-bd);color:var(--green);}
.ic-badge.yellow{background:var(--yellow-bg);border-color:var(--yellow-bd);color:var(--yellow);}
.ic-badge.blue{background:rgba(37,99,235,.1);border-color:var(--border-2);color:var(--blue-lite);}
.ic-msg{font-size:13px;color:var(--fg-4);line-height:1.5;}
.ic-msg strong{color:var(--fg-1);font-weight:500;}

/* roadmap phases */
.phase{border:1px solid var(--border);border-left:2px solid var(--blue);background:rgba(37,99,235,.04);border-radius:0 var(--r-md) var(--r-md) 0;padding:15px 20px;margin-bottom:12px;}
.phase:last-child{margin-bottom:0;}
.phase-tag{font-family:var(--mono);font-size:10px;color:var(--blue-lite);letter-spacing:.06em;margin-bottom:6px;}
.phase-t{font-size:13.5px;font-weight:500;color:var(--fg-1);margin-bottom:4px;}
.phase-d{font-size:12px;color:var(--fg-4);line-height:1.5;}

@media (max-width:900px){.two-col{grid-template-columns:1fr;}.wf{flex-direction:column;}.wf-conn{transform:rotate(90deg);padding:8px 0;}}

/* paginated step transition */
.step-pager{animation:pageIn .5s var(--ease);}
@keyframes pageIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* STEP 04 — simple criterion rule */
.crit-rule{display:flex;gap:18px;align-items:center;background:rgba(37,99,235,.07);border:1px solid var(--border-2);border-radius:var(--r-lg);padding:18px 24px;margin-top:14px;}
.crit-rule .ck{font-family:var(--mono);font-size:11px;color:var(--blue-lite);letter-spacing:.06em;flex-shrink:0;border-right:1px solid var(--border);padding-right:18px;}
.crit-rule .cv{font-size:13.5px;color:var(--fg-2);line-height:1.6;}
.crit-rule .cv strong{color:#fff;font-weight:600;}

/* STEP 05 — secure completion seal */
.finish.secure{border-color:var(--green-bd);background:rgba(34,197,94,.05);}
.finish.secure::after{background:radial-gradient(ellipse at 50% 0%,rgba(34,197,94,.12) 0%,transparent 65%);}
.seal{position:relative;width:84px;height:84px;border-radius:50%;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;border:2px solid var(--green);background:rgba(34,197,94,.1);box-shadow:0 0 28px rgba(34,197,94,.5),inset 0 0 18px rgba(34,197,94,.18);animation:sealPop .5s var(--ease) both;}
.seal svg{width:42px;height:42px;}
.seal::before{content:'';position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(34,197,94,.3);}
@keyframes sealPop{0%{transform:scale(.4);opacity:0;}60%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
.finish.secure .finish-h{color:var(--green);}

/* ════ STEP 01/02 UPGRADED INFOGRAPHICS ════ */
/* interactive bubble matrix */
.nmx tbody tr{cursor:pointer;}
.nmx tbody th{transition:color .2s;}
.nmx.has-sel tbody tr:not(.sel) td .ncirc,.nmx.has-sel tbody tr:not(.sel) th{opacity:.32;}
.nmx tbody tr.sel th{color:var(--blue-lite);}
.ncirc{transition:transform .25s var(--ease),box-shadow .25s,border-color .2s,background .2s,opacity .2s;}
.nmx tbody tr.sel .ncirc{border-color:var(--blue);color:#fff;background:rgba(37,99,235,.18);box-shadow:0 0 16px var(--blue-glow);transform:scale(1.15);}
.mx-hint{font-family:var(--mono);font-size:10px;color:var(--blue-lite);letter-spacing:.04em;margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.mx-hint .dotpulse{width:6px;height:6px;border-radius:50%;background:var(--blue-mid);box-shadow:0 0 8px var(--blue-mid);animation:blink 1.6s infinite;}

/* country dot matrix */
.regtbl tr.kr th,.regtbl tr.kr td{background:rgba(37,99,235,.07);}
.regtbl tr.kr th{color:var(--blue-lite);box-shadow:inset 3px 0 0 var(--blue);}
.tl{display:inline-flex;flex-direction:column;align-items:center;gap:5px;}
.tl i{width:13px;height:13px;border-radius:50%;}
.tl span{font-size:10px;color:var(--fg-4);white-space:nowrap;}
.tl.g i{background:var(--green);box-shadow:0 0 8px rgba(34,197,94,.6);}
.tl.y i{background:var(--yellow);box-shadow:0 0 8px rgba(234,179,8,.55);}
.tl.r i{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,.55);}

/* isotype clocks */
.iso{display:flex;flex-wrap:wrap;gap:7px;max-width:330px;margin-bottom:6px;}
.iso .ico{width:20px;height:20px;}
.iso .ico.red{color:var(--red);} .iso .ico.blue{color:var(--blue-mid);}
.iso .ico.off{color:var(--fg-5);opacity:.5;}
.iso-cap{font-family:var(--mono);font-size:10px;color:var(--fg-4);letter-spacing:.03em;margin:4px 0 18px;}
.iso-cap b{color:var(--green);}
.save-stat{display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--border);padding-top:14px;margin-top:6px;}
.save-stat .sv{font-family:var(--mono);font-size:26px;font-weight:500;color:var(--green);white-space:nowrap;}
.save-stat .sl{font-size:12px;color:var(--fg-4);}

/* slope chart */
.slope text{font-family:var(--mono);}
.slope .axL,.slope .axR{font-size:9px;fill:var(--fg-4);letter-spacing:.04em;}
.slope-legend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--fg-4);letter-spacing:.04em;margin-top:4px;}

/* ── PIE-CLOCK BOARD (STEP 2.4) ── */
.clockboard{overflow:hidden;}
.cb-top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px;flex-wrap:wrap;}
.clock-row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
.pclock{display:flex;flex-direction:column;align-items:center;gap:9px;}
.pclock-svg{width:100%;max-width:118px;aspect-ratio:1;display:block;}
.pclock-h{font-family:var(--mono);font-size:24px;font-weight:500;line-height:1;transition:color .5s var(--ease);}
.pclock-h small{font-size:12px;opacity:.7;margin-left:1px;}
.pclock-l{font-size:12px;color:var(--fg-3);letter-spacing:.01em;white-space:nowrap;}
.cb-foot{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:24px;padding-top:18px;border-top:1px solid var(--border);flex-wrap:wrap;}
.cb-total{display:flex;align-items:baseline;gap:11px;}
.cb-tnum{font-family:var(--mono);font-size:30px;font-weight:500;line-height:1;transition:color .5s var(--ease);}
.cb-tnum small{font-size:14px;opacity:.7;margin-left:1px;}
.cb-tlbl{font-size:12px;color:var(--fg-4);}
.cb-save{font-size:12.5px;color:var(--fg-3);}
.cb-save b{color:var(--fg-1);font-weight:500;}

/* light-switch toggle */
.switch{display:inline-flex;align-items:center;gap:11px;background:none;border:none;cursor:pointer;padding:0;font-family:var(--mono);}
.sw-label{font-size:11px;letter-spacing:.06em;color:var(--fg-5);transition:color .3s;white-space:nowrap;}
.switch .sw-label.off{color:var(--red);}
.switch.on .sw-label.off{color:var(--fg-5);}
.switch .sw-label.onl{color:var(--fg-5);}
.switch.on .sw-label.onl{color:var(--blue-lite);}
.sw-track{position:relative;width:54px;height:28px;border-radius:14px;background:rgba(239,68,68,.18);border:1px solid var(--red-bd);transition:background .35s var(--ease),border-color .35s var(--ease);}
.switch.on .sw-track{background:rgba(37,99,235,.2);border-color:var(--border-2);}
.sw-knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--red);box-shadow:0 0 10px rgba(239,68,68,.6);transition:transform .35s var(--ease),background .35s var(--ease),box-shadow .35s var(--ease);}
.switch.on .sw-knob{transform:translateX(26px);background:var(--blue);box-shadow:0 0 12px var(--blue-glow);}
@media (max-width:760px){.clock-row{grid-template-columns:repeat(3,1fr);}}

/* ── REVEAL ── */
.rv{opacity:0;transform:translateY(18px);transition:opacity .65s var(--ease),transform .65s var(--ease);}
.rv.in{opacity:1;transform:none;}
@media (prefers-reduced-motion: reduce){.rv{opacity:1;transform:none;transition:none}}
</style>

}

<script type="text/babel" data-mod="StatCards">
/* StatCards — three data cards with count-up numerals that animate on first
   scroll-into-view. Signature top-accent line + radial glow on hover. */
function useCountUp(target, suffix, dur, delay, start) {
  const [val, setVal] = React.useState(0);
  React.useEffect(() => {
    if (!start) return;
    let raf, v = 0;
    const step = target / (dur / 16);
    const t = setTimeout(() => {
      const tick = () => {
        v = Math.min(v + step, target);
        setVal(v);
        if (v < target) raf = requestAnimationFrame(tick);
      };
      tick();
    }, delay);
    return () => { clearTimeout(t); cancelAnimationFrame(raf); };
  }, [start]);
  const n = target > 999 ? Math.floor(val).toLocaleString('ko-KR') : Math.floor(val);
  return n + suffix;
}

const STATS = [
  { v: 222, sfx: '%', dur: 1400, delay: 0, color: 'var(--red)',
    label: <>2024년 국내 저작권 위반 사건<br/>전년 대비 급증률</>, src: '국가지식재산위원회 2024 연차보고서' },
  { v: 59565, sfx: '건', dur: 1800, delay: 200, color: 'var(--red)',
    label: <>2024년 경찰청 저작권법<br/>위반 사건 접수 총건수</>, src: '국가지식재산위원회 2024 연차보고서' },
  { v: 86, sfx: '%', dur: 1200, delay: 400, color: 'var(--blue-mid)',
    label: <>전 세계 소비자 중<br/>AI 서비스 사용 비율 (2025)</>, src: 'Elfsight / SQ Magazine 2025' },
];

function StatCard({ stat, start }) {
  const text = useCountUp(stat.v, stat.sfx, stat.dur, stat.delay, start);
  return (
    <div className="stat-card">
      <span className="snum" style={{ color: stat.color }}>{text}</span>
      <div className="slbl">{stat.label}</div>
      <div className="ssrc">{stat.src}</div>
    </div>
  );
}

function StatCards() {
  const ref = React.useRef(null);
  const [start, setStart] = React.useState(false);
  React.useEffect(() => {
    const io = new IntersectionObserver(es => {
      if (es[0].isIntersecting) { setStart(true); io.disconnect(); }
    }, { threshold: .3 });
    if (ref.current) io.observe(ref.current);
    return () => io.disconnect();
  }, []);
  return (
    <div className="stat-row rv" ref={ref} style={{ transitionDelay: '.15s' }}>
      {STATS.map((s, i) => <StatCard key={i} stat={s} start={start} />)}
    </div>
  );
}
window.StatCards = StatCards;

</script>
<script type="text/babel" data-mod="MirrorBar">
/* MirrorBar — perception-gap comparison. Two bars grow from the centre divider
   on scroll-into-view (left grey = perceived, right blue = actual). */
function MirrorBar() {
  const ref = React.useRef(null);
  const [on, setOn] = React.useState(false);
  React.useEffect(() => {
    const io = new IntersectionObserver(es => {
      if (es[0].isIntersecting) { setTimeout(() => setOn(true), 300); io.disconnect(); }
    }, { threshold: .3 });
    if (ref.current) io.observe(ref.current);
    return () => io.disconnect();
  }, []);
  return (
    <div className="mirror-card rv" ref={ref} style={{ transitionDelay: '.2s' }}>
      <div className="mlbl">
        <span>인식률 — AI를 쓴다고 생각하는 비율</span>
        <span style={{ color: 'var(--blue-lite)' }}>실제 사용률</span>
      </div>
      <div className="mbars">
        <div className="ms l"><div className="mf" style={{ width: on ? '33%' : 0 }}></div><span className="mv" style={{ color: 'var(--fg-4)' }}>33%</span></div>
        <div className="mdiv"></div>
        <div className="ms r"><div className="mf" style={{ width: on ? '77%' : 0 }}></div><span className="mv" style={{ color: 'var(--blue-lite)' }}>77%</span></div>
      </div>
      <div className="mgap">← 44%p 인식 격차 존재 · IP 위험 인식도 동일한 패턴 →</div>
    </div>
  );
}
window.MirrorBar = MirrorBar;

</script>
<script type="text/babel" data-mod="CaseCards">
/* CaseCards — two real-case cards with 3D illustrations on white tiles.

<script type="text/babel" data-mod="Diagnosis">
/* Diagnosis — interactive 5-item IP-risk self-check. Tally drives a live
   SAFE / WARNING / DANGER result badge + message. */
const DIAG_ITEMS = [
  '계약서 없이 클라이언트에게 결과물을 넘긴 적이 있다',
  'AI로 만든 결과물을 저작권이 있다고 생각하고 상업적으로 사용했다',
  '내 사업명·로고를 상표 등록하지 않은 상태다',
  '경쟁사가 내 아이디어와 유사한 제품을 내도 대응 방법을 모른다',
  '외주 계약에서 IP 귀속이 누구에게 있는지 불분명한 계약을 한 적 있다',
];

function diagResult(n) {
  if (n === 0) return { badge: '— / 5', cls: 'dim', bd: 'var(--border)',
    msg: <>항목을 선택하면 IP 위험도가 표시됩니다.</> };
  if (n <= 2) return { badge: 'SAFE · ' + n + '/5', cls: 'green', bd: 'var(--green-bd)',
    msg: <><strong>현재 IP 관리 양호.</strong> 이 지침서로 남은 리스크를 보완하세요.</> };
  if (n <= 3) return { badge: 'WARNING · ' + n + '/5', cls: 'yellow', bd: 'var(--yellow-bd)',
    msg: <><strong>위험 구간 존재.</strong> STEP 01부터 순서대로 따라가면 해결됩니다.</> };
  return { badge: 'DANGER · ' + n + '/5', cls: 'red', bd: 'var(--red-bd)',
    msg: <><strong>즉시 점검 필요.</strong> 지금 바로 STEP 01을 시작하세요.</> };
}

function Diagnosis() {
  const [sel, setSel] = React.useState([]);
  const toggle = i => setSel(s => s.includes(i) ? s.filter(x => x !== i) : [...s, i]);
  const n = sel.length;
  const r = diagResult(n);
  return (
    <div className="diag-card rv" style={{ transitionDelay: '.15s' }}>
      <div className="diag-top">
        <div>
          <div className="diag-h">IP 위험도 자가진단</div>
          <div className="diag-s">해당 항목을 모두 체크하세요</div>
        </div>
        <div className="dcnt">{n}<small>/ 5 체크</small></div>
      </div>
      <div className="dlist">

];
const CLK_MAX = 32; // hours that fill the full dial

// pie-wedge path from 12 o'clock, sweeping clockwise by `deg` degrees
function wedgePath(cx, cy, r, deg) {
  if (deg <= 0) return '';
  if (deg >= 359.999) deg = 359.999;
  const rad = (deg - 90) * Math.PI / 180;
  const x = cx + r * Math.cos(rad), y = cy + r * Math.sin(rad);
  const large = deg > 180 ? 1 : 0;
  return `M${cx},${cy} L${cx},${cy - r} A${r},${r} 0 ${large} 1 ${x},${y} Z`;
}

function PieClock({ label, hours, after }) {
  const deg = (hours / CLK_MAX) * 360;
  const color = after ? 'var(--blue)' : 'var(--red)';
  const cx = 50, cy = 50, r = 38;
  const ticks = Array.from({ length: 12 }).map((_, i) => {
    const ang = (i * 30 - 90) * Math.PI / 180;
    const r1 = i % 3 === 0 ? 40 : 43, r2 = 47;
    return <line key={i} x1={cx + r1 * Math.cos(ang)} y1={cy + r1 * Math.sin(ang)}
      x2={cx + r2 * Math.cos(ang)} y2={cy + r2 * Math.sin(ang)}
      stroke="var(--fg-4)" strokeWidth={i % 3 === 0 ? 1.4 : 0.8} strokeLinecap="round" />;
  });
  return (
    <div className="pclock">
      <svg viewBox="0 0 100 100" className="pclock-svg">
        <circle cx={cx} cy={cy} r={r} fill="rgba(255,255,255,.03)" stroke="var(--border-2)" strokeWidth="1" />
        <path d={wedgePath(cx, cy, r, deg)} fill={color} opacity="0.92"
          style={{ transition: 'fill .5s var(--ease)', filter: `drop-shadow(0 0 5px ${color})` }} />
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth="1.2" opacity="0.55" style={{ transition: 'stroke .5s var(--ease)' }} />
        {ticks}
        <circle cx={cx} cy={cy} r="2.4" fill={color} style={{ transition: 'fill .5s var(--ease)' }} />
      </svg>
      <div className="pclock-h" style={{ color }}>{Math.round(hours)}<small>h</small></div>
      <div className="pclock-l">{label}</div>
    </div>
  );
}

function ClockBoard() {
  const [after, setAfter] = React.useState(false);
  const [t, setT] = React.useState(0); // 0 = before, 1 = after (animated)
  const raf = React.useRef(null);
  React.useEffect(() => {
    const target = after ? 1 : 0;
    const start = performance.now(), from = t, dur = 850;
    const tick = (now) => {
      const p = Math.min((now - start) / dur, 1);
      const eased = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; // easeInOutQuad
      setT(from + (target - from) * eased);
      if (p < 1) raf.current = requestAnimationFrame(tick);
    };
    raf.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf.current);
  }, [after]);

  const totalBefore = TASKS.reduce((s, x) => s + x.a, 0);

  const totalNow = Math.round(totalBefore + (totalAfter - totalBefore) * t);

      <BlueprintBG />
      <Navbar activeId={STEP_IDS[step]} onNav={go} />
      <div className="page">
        <div className="step-pager" key={step}>
          {pages[step]}
        </div>
      </div>
      <Footer />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
